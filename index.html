<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover 讓內容延伸至瀏海/圓角區域，搭配 safe-area-inset 使用 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#1c1c2e" />
  <title>資產負債看板</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- 錯誤顯示橫幅：手機上沒有開發者工具可看 console，發生例外時直接顯示在畫面上。
       採用「不遮蔽內容」設計：預設只顯示一個小提示條，點擊才展開完整內容，避免蓋住畫面上方資料。 -->
  <div id="error-banner" class="err-collapsed" style="display:none;"></div>
  <script>
    (function () {
      var banner = document.getElementById("error-banner");
      var lastMsg = "";
      var errorCount = 0;

      function ts() {
        var d = new Date();
        return d.toISOString().slice(0, 19).replace("T", " ");
      }

      // 判斷 App 目前是否仍可運作：以「Vue app.mount() 是否已成功執行」為準，
      // 避免用 DOM 子節點數量判斷（掛載前一瞬間會誤判為不健康，造成錯誤分類不穩定）
      function appLooksHealthy() {
        try {
          return typeof Vue !== "undefined" && window.__appMounted === true;
        } catch (e) {
          return false;
        }
      }

      function render() {
        banner.textContent = "";
        var healthy = appLooksHealthy();
        var bar = document.createElement("div");
        bar.className = "err-bar" + (healthy ? " err-bar-warn" : " err-bar-danger");
        bar.textContent =
          (healthy ? "⚠ " : "🛑 ") +
          "偵測到 " + errorCount + " 個錯誤" +
          (healthy ? "（App 仍運作中，點擊查看細節）" : "（App 可能無法正常運作，點擊查看細節）");
        bar.onclick = function () {
          banner.classList.toggle("err-collapsed");
        };
        banner.appendChild(bar);

        var detailBox = document.createElement("div");
        detailBox.className = "err-detail";

        var head = document.createElement("div");
        head.className = "err-detail-head";
        var title = document.createElement("strong");
        title.textContent = "最近一筆錯誤 " + ts();
        head.appendChild(title);
        var btns = document.createElement("span");
        var copyBtn = document.createElement("button");
        copyBtn.textContent = "複製";
        copyBtn.onclick = function (ev) {
          ev.stopPropagation();
          try {
            if (navigator.clipboard) navigator.clipboard.writeText(lastMsg);
          } catch (e) {}
        };
        var closeBtn = document.createElement("button");
        closeBtn.textContent = "收合";
        closeBtn.onclick = function (ev) {
          ev.stopPropagation();
          banner.classList.add("err-collapsed");
        };
        btns.appendChild(copyBtn);
        btns.appendChild(closeBtn);
        head.appendChild(btns);

        var body = document.createElement("div");
        body.className = "err-detail-body";
        body.textContent = lastMsg;

        detailBox.appendChild(head);
        detailBox.appendChild(body);
        banner.appendChild(detailBox);
      }

      function showError(msg) {
        lastMsg = msg;
        errorCount++;
        banner.style.display = "block";
        // 預設收合，避免蓋住上方畫面內容；使用者可點擊小提示條展開
        banner.classList.add("err-collapsed");
        render();
      }

      // 一般 JS 執行期錯誤（含跨來源腳本的錯誤，若 crossorigin 生效則能看到完整 stack）
      window.addEventListener("error", function (e) {
        var detail;
        if (e.error && e.error.stack) {
          detail = e.error.stack;
        } else if (e.message === "Script error." || !e.message) {
          detail =
            "Script error.（跨來源腳本，瀏覽器隱藏了細節，清除 Cookie/網站資料通常無法解決此問題）\n" +
            "檔案：" + (e.filename || "未知") + ":" + (e.lineno || "?") + ":" + (e.colno || "?") +
            "\n若要看到真正的錯誤內容，最可靠的方式：\n" +
            "1) 用 Mac 連接 iPhone，於 Mac Safari「開發」選單開啟此頁的 Web Inspector（iPhone 需先在\n" +
            "   設定 > Safari > 進階 開啟「網頁檢閱器」），即可看到完整錯誤堆疊\n" +
            "2) 或暫時關閉 Safari 內容阻擋器/擴充功能後再試一次，排除是否為外部程式干擾\n" +
            (appLooksHealthy()
              ? "\n目前偵測到 App 已成功掛載，此錯誤很可能不影響功能，可略過"
              : "\n目前偵測到 App 尚未成功掛載，建議依上述方式取得完整錯誤內容後回報");
        } else {
          detail = (e.message || "未知錯誤") + "\n" + (e.filename || "") + ":" + (e.lineno || "");
        }
        showError(detail);
      });

      // CDN 資源本身載入失敗（例如完全連不上 unpkg.com）——比 window.onerror 更早、更明確
      window.__cdnLoadError = function (name) {
        showError(
          "CDN 資源載入失敗：" + name + "\n" +
          "常見原因：目前網路無法連到 unpkg.com（例如內部網路限制對外連線）。\n" +
          "解法：改用可連外的網路開啟，或將 " + name + " 下載到本機後改用本地路徑引用。"
        );
      };

      window.addEventListener("unhandledrejection", function (e) {
        var r = e.reason;
        var detail = r && r.stack ? r.stack : (r && r.message ? r.message : String(r));
        showError("Promise 未處理錯誤：\n" + detail);
      });
      window.__showAppError = showError;
      // 供 app.js 在掛載完成後呼叫，若當時橫幅已顯示，重新整理健康狀態顏色
      window.__refreshErrorBanner = function () {
        if (banner.style.display === "block") render();
      };
    })();
  </script>

  <div id="app"></div>

  <!-- ============ 分頁模板（text/x-template，不需 build step） ============ -->

  <script type="text/x-template" id="tpl-overview">
    <div class="page-content">
      <div class="kpi-row">
        <div class="kpi-card">
          <div class="kpi-label">資產</div>
          <div class="kpi-value">{{ fmt(totalAssets) }}</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">負債</div>
          <div class="kpi-value">{{ fmt(totalLiabilities) }}</div>
          <div class="kpi-sub">負債比 {{ pct(liabilityRatio) }}</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">淨資產</div>
          <div class="kpi-value" :class="netAssets >= 0 ? 'positive' : 'negative'">{{ fmt(netAssets) }}</div>
        </div>
      </div>

      <div class="card">
        <div class="section-title">資產組成</div>
        <div v-if="totalAssets <= 0" class="empty-hint">尚無資產資料，請至「明細」新增</div>
        <div v-for="item in breakdown" :key="item.type" class="asset-item">
          <div class="asset-item-row">
            <span class="asset-item-name">{{ item.type }}</span>
            <span class="asset-item-amt">{{ fmt(item.amount) }}（{{ pct(item.ratio) }}）</span>
          </div>
          <div class="progress-bar">
            <div class="progress-bar-fill" :style="{ width: (item.ratio * 100) + '%' }"></div>
          </div>
        </div>
      </div>
    </div>
  </script>

  <script type="text/x-template" id="tpl-rebalance">
    <div class="page-content">
      <div class="card">
        <div class="section-title">曝險概況</div>
        <div class="summary-group"><span>曝險金額</span><span>{{ fmt(exposureTotal) }}</span></div>
        <div class="summary-group"><span>可動用總金額（流動資產+投資）</span><span>{{ fmt(pool) }}</span></div>
        <div class="summary-group"><span>曝險比</span><span>{{ pct(exposureRatio) }}</span></div>
      </div>

      <div class="card">
        <div class="section-title">再平衡率</div>
        <div class="form-row">
          <label>投資佔比</label>
          <select v-model.number="settings.rebalanceRatio" @change="onRatioChange">
            <option v-for="r in ratioOptions" :key="r" :value="r">
              {{ r }}%
            </option>
          </select>
        </div>
        <div class="summary-group"><span>流動資產</span><span>{{ fmt(liquidTWD) }}（{{ pct(liquidRatio) }}）</span></div>
        <div class="summary-group"><span>投資</span><span>{{ fmt(investTWD) }}（{{ pct(investRatio) }}）</span></div>
      </div>

      <div class="card rebalance-result">
        <div v-if="pool <= 0" class="empty-hint">尚無流動資產或投資資料</div>
        <template v-else>
          <div class="rebalance-action" :class="action.type">{{ action.label }}</div>
          <div class="rebalance-amount" v-if="action.amount > 0">{{ fmt(action.amount) }}</div>
        </template>
      </div>
    </div>
  </script>

  <script type="text/x-template" id="tpl-detail">
    <div class="page-content">
      <!-- 5 個資產/負債類別子分頁 -->
      <div class="subtab-bar">
        <button
          v-for="t in types"
          :key="t"
          class="subtab-btn"
          :class="{ active: activeType === t }"
          @click="activeType = t"
        >{{ t }}</button>
      </div>

      <!-- 匯總區 -->
      <div class="card">
        <!-- 第一層標題：非投資為「總計」；投資為「市價」，並多一行「曝險金額」 -->
        <div class="sum-total-row">
          <span class="sum-total-name">{{ isInvest ? '市價' : '總計' }}</span>
          <span class="sum-total-amt">{{ num(summary.totalTWD) }}</span>
        </div>
        <div v-if="isInvest" class="sum-total-row sum-total-sub">
          <span class="sum-total-name">曝險金額</span>
          <span class="sum-total-amt">{{ num(summary.exposureTotal) }}</span>
        </div>

        <div v-if="summary.groups.length === 0" class="empty-hint">此類別尚無資料</div>
        <div v-for="g in summary.groups" :key="g.key" class="sum-group">
          <!-- 第二層：幣別合計，右側一律用金額加總 -->
          <div class="sum-group-head">
            <span>{{ g.label }}</span>
            <span>
              {{ num(g.subtotalTWD) }}<span v-if="g.isForeign" class="sum-orig"> ({{ num(g.subtotalOrig) }})</span>
            </span>
          </div>
          <!-- 第三層：帳戶/項目，可點選作為下方明細的篩選條件 -->
          <div
            v-for="a in g.accounts"
            :key="a.key"
            class="sum-acc-card"
            :class="{ selected: isSelected(a.account) }"
            @click="toggleSelect(a.account)"
          >
            <div class="sum-acc-row1">
              <span class="sum-acc-name">{{ a.account }}</span>
              <span class="sum-acc-cur">{{ isInvest ? (num(a.units) + ' 單位') : a.currency }}</span>
            </div>
            <div class="sum-acc-row2">
              <span></span>
              <span>
                {{ num(a.amountTWD) }}<span v-if="a.isForeign" class="sum-orig"> ({{ num(a.amountOrig) }})</span>
              </span>
            </div>
          </div>
        </div>
      </div>

      <!-- 明細卡片列表 -->
      <div class="card">
        <div class="detail-toolbar">
          <button class="btn" @click="addRow">＋新增一筆</button>
          <button class="btn warn" @click="refreshAll" :disabled="refreshing">
            {{ refreshing ? '更新中…' : '市價/匯率' }}
          </button>
        </div>

        <div v-if="selectedAccounts.length > 0" class="filter-hint">
          篩選中：{{ selectedAccounts.join('、') }}
          <button class="btn small" @click="selectedAccounts = []">清除篩選</button>
        </div>

        <div v-if="visibleRecords.length === 0" class="empty-hint">此類別尚無明細，點「＋新增一筆」開始</div>

        <div v-for="rec in visibleRecords" :key="rec.id" class="rec-card" :class="{ 'rec-excluded': rec.excluded }">
          <div class="rec-grid">
            <div class="rec-field">
              <label>類別</label>
              <select v-model="rec.type" @change="onTypeChange(rec)">
                <option v-for="t in types" :key="t" :value="t">{{ t }}</option>
              </select>
            </div>
            <div class="rec-field">
              <label>帳戶/項目</label>
              <input type="text" v-model="rec.account" placeholder="帳戶/項目" />
            </div>
            <div class="rec-field">
              <label>日期</label>
              <input type="date" v-model="rec.date" />
            </div>

            <div class="rec-field">
              <label>價格</label>
              <input
                type="number"
                v-model.number="rec.unitPrice"
                @change="recalc(rec)"
                :readonly="rec.type !== '投資'"
              />
            </div>
            <div class="rec-field">
              <label>幣別</label>
              <input type="text" v-model="rec.currency" @change="recalc(rec)" />
            </div>
            <div class="rec-field">
              <label>匯率</label>
              <input type="number" v-model.number="rec.fxRate" @change="recalc(rec)" />
            </div>
            <div class="rec-field">
              <label>單位</label>
              <input type="number" v-model.number="rec.units" @change="recalc(rec)" />
            </div>

            <div class="rec-field">
              <label>金額</label>
              <input type="text" :value="num(money(rec))" readonly />
            </div>
            <div class="rec-field" v-if="rec.type === '投資'">
              <label>槓桿倍數</label>
              <input type="number" step="0.1" v-model.number="rec.leverage" />
            </div>
            <div class="rec-field" v-if="rec.type === '投資'">
              <label>曝險金額</label>
              <input type="text" :value="exposure(rec).toLocaleString()" readonly />
            </div>

            <div class="rec-field rec-field-full">
              <label>備註</label>
              <input type="text" v-model="rec.note" placeholder="備註" />
            </div>
          </div>
          <div class="rec-actions">
            <label class="rec-exclude">
              <input type="checkbox" v-model="rec.excluded" :true-value="1" :false-value="0" />
              <span>不計入</span>
            </label>
            <button class="btn small danger" @click="removeRow(rec.id)">刪除</button>
          </div>
        </div>
      </div>
    </div>
  </script>

  <script type="text/x-template" id="tpl-settings">
    <div class="page-content">
      <div class="card">
        <div class="section-title">顯示單位</div>
        <div class="form-row">
          <label>總覽金額單位</label>
          <select v-model="settings.unit">
            <option value="yuan">元</option>
            <option value="wan">萬元</option>
          </select>
        </div>
      </div>

      <div class="card">
        <div class="section-title">資料來源自動更新</div>
        <div class="form-row">
          <label>自動抓取即時匯率（Frankfurter）</label>
          <input type="checkbox" v-model="settings.autoFx" />
        </div>
        <div class="form-row">
          <label>自動抓取股票市值（best-effort，可能失敗）</label>
          <input type="checkbox" v-model="settings.autoStock" />
        </div>
        <div class="empty-hint" style="text-align:left">
          預設為手動輸入。於「明細」頁右上角的「市價/匯率」按鈕可一次更新所有資料的匯率與（投資的）市價；
          股價來源非官方 API，若查詢失敗請改回手動輸入。內部網路無法連外時更新會失敗，屬正常現象。
        </div>
      </div>

      <div class="card">
        <div class="section-title">資料管理</div>
        <div class="toolbar">
          <button class="btn secondary" @click="exportCsv">匯出 CSV</button>
          <button class="btn secondary" @click="$refs.fileInput.click()">匯入 CSV</button>
          <input type="file" ref="fileInput" accept=".csv" style="display:none" @change="importCsv" />
          <button class="btn secondary" @click="loadSample">載入模擬資料</button>
          <button class="btn danger" @click="resetData">清除所有本地資料</button>
          <button class="btn danger" @click="forceReset">強制清除並重新載入</button>
        </div>
        <div class="empty-hint" style="text-align:left">所有資料僅儲存在本機瀏覽器 localStorage，清除瀏覽器資料或更換裝置/瀏覽器將會遺失，請定期使用「匯出 CSV」備份。匯入 CSV 與載入模擬資料皆為「附加」至現有資料。若一般清除無效或資料異常，可用「強制清除並重新載入」。iOS Safari 中「設定 > Safari > 清除瀏覽記錄與網站資料」或「清除 Cookie」也會一併清除本 App 的資料，請務必先備份再操作。</div>
        <div class="empty-hint" style="text-align:left">Web Inspector 疑難排解：若畫面出現「Script error.」等看不到細節的錯誤，可用 Mac 連接 iPhone，於 iPhone「設定 > Safari > 進階」開啟「網頁檢閱器」，再於 Mac Safari「開發」選單中開啟本頁面即可看到完整錯誤堆疊。</div>
      </div>
    </div>
  </script>

  <!-- Vue 3 全域版本（CDN，不需 npm/build）。crossorigin 讓跨來源腳本的錯誤細節能被 window.onerror 取得。
       ?cb= 為快取破壞參數：避免瀏覽器沿用「加上 crossorigin 之前」快取的舊版回應（會導致錯誤細節持續被隱藏）。 -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js?cb=20260818" crossorigin="anonymous" onerror="window.__cdnLoadError && window.__cdnLoadError('Vue')"></script>
  <!-- PapaParse：處理 CSV 匯入/匯出 -->
  <script src="https://unpkg.com/papaparse@5/papaparse.min.js?cb=20260818" crossorigin="anonymous" onerror="window.__cdnLoadError && window.__cdnLoadError('PapaParse')"></script>

  <script src="js/store.js"></script>
  <script src="js/services.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
