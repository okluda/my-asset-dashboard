<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover 讓內容延伸至瀏海/圓角區域，搭配 safe-area-inset 使用 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#1c1c2e" />
  <title>資產負債看板</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- 錯誤顯示橫幅：手機上沒有開發者工具可看 console，發生例外時直接顯示在畫面上 -->
  <div id="error-banner" style="display:none; position:fixed; top:0; left:0; right:0; z-index:9999; background:#b00020; color:#fff; padding:10px 14px; font-size:13px; white-space:pre-wrap; max-height:40vh; overflow:auto;"></div>
  <script>
    (function () {
      var banner = document.getElementById("error-banner");
      function showError(msg) {
        banner.style.display = "block";
        banner.textContent = "⚠ 發生錯誤，請截圖回報：\n" + msg;
      }
      window.addEventListener("error", function (e) {
        showError((e.message || "未知錯誤") + "\n" + (e.filename || "") + ":" + (e.lineno || ""));
      });
      window.addEventListener("unhandledrejection", function (e) {
        showError("Promise 錯誤：" + (e.reason && e.reason.message ? e.reason.message : e.reason));
      });
      window.__showAppError = showError;
    })();
  </script>

  <div id="app"></div>

  <!-- ============ 分頁模板（text/x-template，不需 build step） ============ -->

  <script type="text/x-template" id="tpl-overview">
    <div class="page-content">
      <div class="kpi-row">
        <div class="kpi-card">
          <div class="kpi-label">資產</div>
          <div class="kpi-value">{{ fmt(totalAssets) }}</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">負債</div>
          <div class="kpi-value">{{ fmt(totalLiabilities) }}</div>
          <div class="kpi-sub">負債比 {{ pct(liabilityRatio) }}</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">淨資產</div>
          <div class="kpi-value" :class="netAssets >= 0 ? 'positive' : 'negative'">{{ fmt(netAssets) }}</div>
        </div>
      </div>

      <div class="card">
        <div class="section-title">資產組成</div>
        <div v-if="totalAssets <= 0" class="empty-hint">尚無資產資料，請至「明細」新增</div>
        <div v-for="item in breakdown" :key="item.type" class="asset-item">
          <div class="asset-item-row">
            <span class="asset-item-name">{{ item.type }}</span>
            <span class="asset-item-amt">{{ fmt(item.amount) }}（{{ pct(item.ratio) }}）</span>
          </div>
          <div class="progress-bar">
            <div class="progress-bar-fill" :style="{ width: (item.ratio * 100) + '%' }"></div>
          </div>
        </div>
      </div>
    </div>
  </script>

  <script type="text/x-template" id="tpl-rebalance">
    <div class="page-content">
      <div class="card">
        <div class="section-title">曝險概況</div>
        <div class="summary-group"><span>曝險金額</span><span>{{ fmt(exposureTotal) }}</span></div>
        <div class="summary-group"><span>可動用總金額（流動資產+投資）</span><span>{{ fmt(pool) }}</span></div>
        <div class="summary-group"><span>曝險比</span><span>{{ pct(exposureRatio) }}</span></div>
      </div>

      <div class="card">
        <div class="section-title">再平衡率</div>
        <div class="form-row">
          <label>投資佔比</label>
          <select v-model.number="settings.rebalanceRatio" @change="onRatioChange">
            <option v-for="r in ratioOptions" :key="r" :value="r">
              {{ r }}%
            </option>
          </select>
        </div>
        <div class="summary-group"><span>流動資產</span><span>{{ fmt(liquidTWD) }}（{{ pct(liquidRatio) }}）</span></div>
        <div class="summary-group"><span>投資</span><span>{{ fmt(investTWD) }}（{{ pct(investRatio) }}）</span></div>
      </div>

      <div class="card rebalance-result">
        <div v-if="pool <= 0" class="empty-hint">尚無流動資產或投資資料</div>
        <template v-else>
          <div class="rebalance-action" :class="action.type">{{ action.label }}</div>
          <div class="rebalance-amount" v-if="action.amount > 0">{{ fmt(action.amount) }}</div>
        </template>
      </div>
    </div>
  </script>

  <script type="text/x-template" id="tpl-detail">
    <div class="page-content">
      <!-- 5 個資產/負債類別子分頁 -->
      <div class="subtab-bar">
        <button
          v-for="t in types"
          :key="t"
          class="subtab-btn"
          :class="{ active: activeType === t }"
          @click="activeType = t"
        >{{ t }}</button>
      </div>

      <!-- 匯總區 -->
      <div class="card">
        <!-- 第一層標題：非投資為「總計」；投資為「市價」，並多一行「曝險金額」 -->
        <div class="sum-total-row">
          <span class="sum-total-name">{{ isInvest ? '市價' : '總計' }}</span>
          <span class="sum-total-amt">{{ num(summary.totalTWD) }}</span>
        </div>
        <div v-if="isInvest" class="sum-total-row sum-total-sub">
          <span class="sum-total-name">曝險金額</span>
          <span class="sum-total-amt">{{ num(summary.exposureTotal) }}</span>
        </div>

        <div v-if="summary.groups.length === 0" class="empty-hint">此類別尚無資料</div>
        <div v-for="g in summary.groups" :key="g.key" class="sum-group">
          <!-- 第二層：幣別合計，右側一律用金額加總 -->
          <div class="sum-group-head">
            <span>{{ g.label }}</span>
            <span>
              {{ num(g.subtotalTWD) }}<span v-if="g.isForeign" class="sum-orig"> ({{ num(g.subtotalOrig) }})</span>
            </span>
          </div>
          <!-- 第三層：帳戶/項目，可點選作為下方明細的篩選條件 -->
          <div
            v-for="a in g.accounts"
            :key="a.key"
            class="sum-acc-card"
            :class="{ selected: isSelected(a.account) }"
            @click="toggleSelect(a.account)"
          >
            <div class="sum-acc-row1">
              <span class="sum-acc-name">{{ a.account }}</span>
              <span class="sum-acc-cur">{{ isInvest ? (num(a.units) + ' 單位') : a.currency }}</span>
            </div>
            <div class="sum-acc-row2">
              <span></span>
              <span>
                {{ num(a.amountTWD) }}<span v-if="a.isForeign" class="sum-orig"> ({{ num(a.amountOrig) }})</span>
              </span>
            </div>
          </div>
        </div>
      </div>

      <!-- 明細卡片列表 -->
      <div class="card">
        <div class="detail-toolbar">
          <button class="btn" @click="addRow">＋新增一筆</button>
          <button class="btn warn" @click="refreshAll" :disabled="refreshing">
            {{ refreshing ? '更新中…' : '市價/匯率' }}
          </button>
        </div>

        <div v-if="selectedAccounts.length > 0" class="filter-hint">
          篩選中：{{ selectedAccounts.join('、') }}
          <button class="btn small" @click="selectedAccounts = []">清除篩選</button>
        </div>

        <div v-if="visibleRecords.length === 0" class="empty-hint">此類別尚無明細，點「＋新增一筆」開始</div>

        <div v-for="rec in visibleRecords" :key="rec.id" class="rec-card" :class="{ 'rec-excluded': rec.excluded }">
          <div class="rec-grid">
            <div class="rec-field">
              <label>類別</label>
              <select v-model="rec.type" @change="onTypeChange(rec)">
                <option v-for="t in types" :key="t" :value="t">{{ t }}</option>
              </select>
            </div>
            <div class="rec-field">
              <label>帳戶/項目</label>
              <input type="text" v-model="rec.account" placeholder="帳戶/項目" />
            </div>
            <div class="rec-field">
              <label>日期</label>
              <input type="date" v-model="rec.date" />
            </div>

            <div class="rec-field">
              <label>價格</label>
              <input
                type="number"
                v-model.number="rec.unitPrice"
                @change="recalc(rec)"
                :readonly="rec.type !== '投資'"
              />
            </div>
            <div class="rec-field">
              <label>幣別</label>
              <input type="text" v-model="rec.currency" @change="recalc(rec)" />
            </div>
            <div class="rec-field">
              <label>匯率</label>
              <input type="number" v-model.number="rec.fxRate" @change="recalc(rec)" />
            </div>
            <div class="rec-field">
              <label>單位</label>
              <input type="number" v-model.number="rec.units" @change="recalc(rec)" />
            </div>

            <div class="rec-field">
              <label>金額</label>
              <input type="text" :value="num(money(rec))" readonly />
            </div>
            <div class="rec-field" v-if="rec.type === '投資'">
              <label>槓桿倍數</label>
              <input type="number" step="0.1" v-model.number="rec.leverage" />
            </div>
            <div class="rec-field" v-if="rec.type === '投資'">
              <label>曝險金額</label>
              <input type="text" :value="exposure(rec).toLocaleString()" readonly />
            </div>

            <div class="rec-field rec-field-full">
              <label>備註</label>
              <input type="text" v-model="rec.note" placeholder="備註" />
            </div>
          </div>
          <div class="rec-actions">
            <label class="rec-exclude">
              <input type="checkbox" v-model="rec.excluded" />
              <span>不計入</span>
            </label>
            <button class="btn small danger" @click="removeRow(rec.id)">刪除</button>
          </div>
        </div>
      </div>
    </div>
  </script>

  <script type="text/x-template" id="tpl-settings">
    <div class="page-content">
      <div class="card">
        <div class="section-title">顯示單位</div>
        <div class="form-row">
          <label>總覽金額單位</label>
          <select v-model="settings.unit">
            <option value="yuan">元</option>
            <option value="wan">萬元</option>
          </select>
        </div>
      </div>

      <div class="card">
        <div class="section-title">資料來源自動更新</div>
        <div class="form-row">
          <label>自動抓取即時匯率（Frankfurter）</label>
          <input type="checkbox" v-model="settings.autoFx" />
        </div>
        <div class="form-row">
          <label>自動抓取股票市值（best-effort，可能失敗）</label>
          <input type="checkbox" v-model="settings.autoStock" />
        </div>
        <div class="empty-hint" style="text-align:left">
          預設為手動輸入。於「明細」頁右上角的「市價/匯率」按鈕可一次更新所有資料的匯率與（投資的）市價；
          股價來源非官方 API，若查詢失敗請改回手動輸入。內部網路無法連外時更新會失敗，屬正常現象。
        </div>
      </div>

      <div class="card">
        <div class="section-title">資料管理</div>
        <div class="toolbar">
          <button class="btn secondary" @click="exportCsv">匯出 CSV</button>
          <button class="btn secondary" @click="$refs.fileInput.click()">匯入 CSV</button>
          <input type="file" ref="fileInput" accept=".csv" style="display:none" @change="importCsv" />
          <button class="btn secondary" @click="loadSample">載入模擬資料</button>
          <button class="btn danger" @click="resetData">清除所有本地資料</button>
        </div>
        <div class="empty-hint" style="text-align:left">所有資料僅儲存在本機瀏覽器 localStorage，清除瀏覽器資料或更換裝置/瀏覽器將會遺失，請定期使用「匯出 CSV」備份。匯入 CSV 與載入模擬資料皆為「附加」至現有資料。</div>
      </div>
    </div>
  </script>

  <!-- Vue 3 全域版本（CDN，不需 npm/build） -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <!-- PapaParse：處理 CSV 匯入/匯出 -->
  <script src="https://unpkg.com/papaparse@5/papaparse.min.js"></script>

  <script src="js/store.js"></script>
  <script src="js/services.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
