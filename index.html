<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover 讓內容延伸至瀏海/圓角區域，搭配 safe-area-inset 使用 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#1c1c2e" />
  <title>fishbubble</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- 錯誤顯示橫幅：手機上沒有開發者工具可看 console，發生例外時直接顯示在畫面上。
       採用「不遮蔽內容」設計：預設只顯示一個小提示條，點擊才展開完整內容，避免蓋住畫面上方資料。 -->
  <div id="error-banner" class="err-collapsed" style="display:none;"></div>
  <script>
    (function () {
      var banner = document.getElementById("error-banner");
      var lastMsg = "";
      var errorCount = 0;

      function ts() {
        var d = new Date();
        return d.toISOString().slice(0, 19).replace("T", " ");
      }

      // 判斷 App 目前是否仍可運作：以「Vue app.mount() 是否已成功執行」為準，
      // 避免用 DOM 子節點數量判斷（掛載前一瞬間會誤判為不健康，造成錯誤分類不穩定）
      function appLooksHealthy() {
        try {
          return typeof Vue !== "undefined" && window.__appMounted === true;
        } catch (e) {
          return false;
        }
      }

      function render() {
        banner.textContent = "";
        var healthy = appLooksHealthy();
        var bar = document.createElement("div");
        bar.className = "err-bar" + (healthy ? " err-bar-warn" : " err-bar-danger");
        bar.textContent =
          (healthy ? "⚠ " : "🛑 ") +
          "偵測到 " + errorCount + " 個錯誤" +
          (healthy ? "（App 仍運作中，點擊查看細節）" : "（App 可能無法正常運作，點擊查看細節）");
        bar.onclick = function () {
          banner.classList.toggle("err-collapsed");
        };
        banner.appendChild(bar);

        var detailBox = document.createElement("div");
        detailBox.className = "err-detail";

        var head = document.createElement("div");
        head.className = "err-detail-head";
        var title = document.createElement("strong");
        title.textContent = "最近一筆錯誤 " + ts();
        head.appendChild(title);
        var btns = document.createElement("span");
        var copyBtn = document.createElement("button");
        copyBtn.textContent = "複製";
        copyBtn.onclick = function (ev) {
          ev.stopPropagation();
          try {
            if (navigator.clipboard) navigator.clipboard.writeText(lastMsg);
          } catch (e) {}
        };
        var closeBtn = document.createElement("button");
        closeBtn.textContent = "收合";
        closeBtn.onclick = function (ev) {
          ev.stopPropagation();
          banner.classList.add("err-collapsed");
        };
        btns.appendChild(copyBtn);
        btns.appendChild(closeBtn);
        head.appendChild(btns);

        var body = document.createElement("div");
        body.className = "err-detail-body";
        body.textContent = lastMsg;

        detailBox.appendChild(head);
        detailBox.appendChild(body);
        banner.appendChild(detailBox);
      }

      function showError(msg) {
        lastMsg = msg;
        errorCount++;
        banner.style.display = "block";
        // 預設收合，避免蓋住上方畫面內容；使用者可點擊小提示條展開
        banner.classList.add("err-collapsed");
        render();
      }

      // 一般 JS 執行期錯誤（含跨來源腳本的錯誤，若 crossorigin 生效則能看到完整 stack）
      window.addEventListener("error", function (e) {
        var detail;
        if (e.error && e.error.stack) {
          detail = e.error.stack;
        } else if (e.message === "Script error." || !e.message) {
          detail =
            "Script error.（跨來源腳本，瀏覽器隱藏了細節，清除 Cookie/網站資料通常無法解決此問題）\n" +
            "檔案：" + (e.filename || "未知") + ":" + (e.lineno || "?") + ":" + (e.colno || "?") +
            "\n若要看到真正的錯誤內容，最可靠的方式：\n" +
            "1) 用 Mac 連接 iPhone，於 Mac Safari「開發」選單開啟此頁的 Web Inspector（iPhone 需先在\n" +
            "   設定 > Safari > 進階 開啟「網頁檢閱器」），即可看到完整錯誤堆疊\n" +
            "2) 或暫時關閉 Safari 內容阻擋器/擴充功能後再試一次，排除是否為外部程式干擾\n" +
            (appLooksHealthy()
              ? "\n目前偵測到 App 已成功掛載，此錯誤很可能不影響功能，可略過"
              : "\n目前偵測到 App 尚未成功掛載，建議依上述方式取得完整錯誤內容後回報");
        } else {
          detail = (e.message || "未知錯誤") + "\n" + (e.filename || "") + ":" + (e.lineno || "");
        }
        showError(detail);
      });

      // CDN 資源本身載入失敗（例如完全連不上 unpkg.com）——比 window.onerror 更早、更明確
      window.__cdnLoadError = function (name) {
        showError(
          "CDN 資源載入失敗：" + name + "\n" +
          "常見原因：目前網路無法連到 unpkg.com（例如內部網路限制對外連線）。\n" +
          "解法：改用可連外的網路開啟，或將 " + name + " 下載到本機後改用本地路徑引用。"
        );
      };

      window.addEventListener("unhandledrejection", function (e) {
        var r = e.reason;
        var detail = r && r.stack ? r.stack : (r && r.message ? r.message : String(r));
        showError("Promise 未處理錯誤：\n" + detail);
      });
      window.__showAppError = showError;
      // 供 app.js 在掛載完成後呼叫，若當時橫幅已顯示，重新整理健康狀態顏色
      window.__refreshErrorBanner = function () {
        if (banner.style.display === "block") render();
      };
    })();
  </script>

  <div id="app"></div>

  <!-- ============ 分頁模板（text/x-template，不需 build step） ============ -->

  <script type="text/x-template" id="tpl-overview">
    <div class="page-content">
      <div class="kpi-row">
        <div class="kpi-card">
          <div class="kpi-label">資產</div>
          <div class="kpi-value">{{ fmt(totalAssets) }}</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">負債</div>
          <div class="kpi-value">{{ fmt(totalLiabilities) }}</div>
          <div class="kpi-sub">負債比 {{ pct(liabilityRatio) }}</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">淨資產</div>
          <div class="kpi-value" :class="netAssets >= 0 ? 'positive' : 'negative'">{{ fmt(netAssets) }}</div>
        </div>
      </div>

      <div class="card">
        <div class="section-title">資產</div>
        <div v-if="totalAssets <= 0" class="empty-hint">尚無資產資料，請至「明細」新增</div>
        <div v-for="item in breakdown" :key="item.type" class="asset-item">
          <div class="asset-item-row">
            <span class="asset-item-name">{{ catName(item.type) }}</span>
            <span class="asset-item-amt">{{ fmt(item.amount) }}（{{ pct(item.ratio) }}）</span>
          </div>
          <div class="progress-bar">
            <div class="progress-bar-fill" :style="{ width: (item.ratio * 100) + '%' }"></div>
          </div>
        </div>
      </div>
    </div>
  </script>

  <script type="text/x-template" id="tpl-rebalance">
    <div class="page-content">
      <div class="card">
        <div class="section-title">配置概況及再平衡</div>
        <div class="reb-ratio-row">
          <span class="reb-ratio-label">曝險比</span>
          <span class="reb-ratio-value">{{ pct(exposureRatio) }}</span>
        </div>
        <div class="reb-ratio-row">
          <span class="reb-ratio-label">曝險比（槓桿）</span>
          <span class="reb-ratio-value">{{ pct(exposureLeveragedRatio) }}</span>
        </div>
        <div class="summary-group"><span>曝險金額</span><span>{{ fmt(exposureTotal) }}</span></div>
        <div class="summary-group"><span>資金部位</span><span>{{ fmt(pool) }}</span></div>
        <div class="reb-sub-row"><span>{{ catName('流動資金') }}</span><span>{{ fmt(liquidTWD) }}（{{ pct(liquidRatio) }}）</span></div>
        <div class="reb-sub-row"><span>{{ catName('投資') }}</span><span>{{ fmt(investTWD) }}（{{ pct(investRatio) }}）</span></div>
        <div class="form-row reb-ratio-select-row">
          <label>投資配置比</label>
          <select v-model.number="settings.rebalanceRatio" @change="onRatioChange">
            <option v-for="r in ratioOptions" :key="r" :value="r">
              {{ r }}%
            </option>
          </select>
        </div>
      </div>

      <div class="card rebalance-result">
        <div v-if="pool <= 0" class="empty-hint">尚無流動資金或投資資料</div>
        <template v-else>
          <div v-if="action.type === 'hold'" class="rebalance-hold">{{ action.label }}</div>
          <div v-else class="rebalance-advice-box" :class="action.type">
            <div class="reb-icon-circle" :class="action.type">{{ action.type === 'buy' ? '↓' : '↑' }}</div>
            <div class="rebalance-advice-text">
              <div class="rebalance-advice-title">再平衡建議</div>
              <div class="rebalance-advice-amount">{{ action.label }} {{ fmt(action.amount) }}</div>
            </div>
          </div>
        </template>
      </div>

      <div class="card rebalance-result">
        <div v-if="pool <= 0" class="empty-hint">尚無流動資金或投資資料</div>
        <template v-else>
          <div v-if="actionLeveraged.type === 'hold'" class="rebalance-hold">{{ actionLeveraged.label }}</div>
          <div v-else class="rebalance-advice-box" :class="actionLeveraged.type">
            <div class="reb-icon-circle" :class="actionLeveraged.type">{{ actionLeveraged.type === 'buy' ? '↓' : '↑' }}</div>
            <div class="rebalance-advice-text">
              <div class="rebalance-advice-title">槓桿再平衡建議</div>
              <div class="rebalance-advice-amount">{{ actionLeveraged.label }} {{ fmt(actionLeveraged.amount) }}</div>
            </div>
          </div>
        </template>
      </div>
    </div>
  </script>

  <script type="text/x-template" id="tpl-detail">
    <div class="page-content">
      <!-- 5 個資產/負債類別子分頁 -->
      <div class="subtab-bar">
        <button
          v-for="t in types"
          :key="t"
          class="subtab-btn"
          :class="{ active: activeType === t }"
          @click="activeType = t"
        >{{ catName(t) }}</button>
      </div>

      <!-- 匯總區 -->
      <div class="card">
        <!-- 第一層標題：非投資為「總計」；投資為「市價」，並多一行「曝險金額」 -->
        <div class="sum-total-row">
          <span class="sum-total-name">{{ isInvest ? '市價' : '總計' }}</span>
          <span class="sum-total-amt">{{ fmt(summary.totalTWD) }}</span>
        </div>
        <div v-if="isInvest" class="sum-total-row sum-total-sub">
          <span class="sum-total-name">曝險金額</span>
          <span class="sum-total-amt">{{ fmt(summary.exposureTotal) }}</span>
        </div>

        <div v-if="summary.groups.length === 0" class="empty-hint">此類別尚無資料</div>
        <div v-for="g in summary.groups" :key="g.key" class="sum-group">
          <!-- 第二層：幣別合計。外幣原幣金額換行顯示在第二行右對齊，避免撐長第一行；
               台幣或基準幣別維持單行。 -->
          <div class="sum-group-head">
            <span>{{ g.label }}</span>
            <span>{{ fmt(g.subtotalTWD) }}</span>
          </div>
          <div v-if="g.isForeign" class="sum-group-orig">
            <span class="sum-orig">({{ num(g.subtotalOrig) }})</span>
          </div>
          <!-- 第三層：帳戶/項目，可點選作為下方明細的篩選條件（依所屬幣別分組，
               篩選時同時比對「帳戶＋幣別」，避免不同幣別但同名帳戶互相混淆） -->
            <div
              v-for="a in g.accounts"
              :key="a.key"
              class="sum-acc-card"
              :class="{ selected: isAccountSelected(a.account, a.currency) }"
              @click="toggleAccountFilter(a.account, a.currency)"
            >
              <div class="sum-acc-row1">
                <span class="sum-acc-name">{{ a.account }}</span>
                <span class="sum-acc-amt">{{ fmt(a.amountTWD) }}</span>
              </div>
              <div v-if="isInvest || a.isForeign" class="sum-acc-row2">
                <span class="sum-acc-sub">
                  <template v-if="isInvest && a.isForeign">{{ num(a.units) }} 單位 ({{ num(a.amountOrig) }})</template>
                  <template v-else-if="isInvest">{{ num(a.units) }} 單位</template>
                  <template v-else>({{ num(a.amountOrig) }})</template>
                </span>
              </div>
            </div>
        </div>
      </div>

      <!-- 明細卡片列表 -->
      <div class="card">
        <div class="detail-toolbar">
          <button class="btn" @click="addRow">＋新增</button>
          <div class="date-filter-group" role="group" aria-label="日期篩選">
            <button
              type="button"
              class="btn secondary date-nav-btn"
              @click="goPrevDay"
              aria-label="前一天"
              title="前一天"
            >‹</button>
            <button
              class="btn secondary date-filter-btn"
              :class="{ active: dateFilterActive }"
              @click="onDateFilterClick"
              :aria-pressed="dateFilterActive"
              :aria-label="'日期篩選：' + dateFilterValue + (dateFilterActive ? '（篩選中）' : '') + '。點一下套用或取消此日期篩選'"
              title="點一下：套用或取消此日期篩選"
            >{{ dateFilterValue }}</button>
            <button
              type="button"
              class="btn secondary date-nav-btn"
              @click="goNextDay"
              aria-label="後一天"
              title="後一天"
            >›</button>
            <div class="date-cal-wrap">
              <span class="date-cal-icon" aria-hidden="true">📅</span>
              <input
                type="date"
                class="date-cal-input"
                v-model="dateFilterValue"
                @change="onDateFilterInputChange"
                aria-label="開啟日曆選擇日期"
                title="開啟日曆選擇日期"
              />
            </div>
          </div>
        </div>

        <!-- 不計入三態篩選：全部／已勾選不計入／未勾選不計入。僅影響顯示，不修改原始資料 -->
        <div class="excl-filter-row" role="group" aria-label="不計入篩選">
          <button
            type="button"
            class="excl-filter-btn"
            :class="{ active: excludedStatus === 'all' }"
            @click="excludedStatus = 'all'"
          >全部</button>
          <button
            type="button"
            class="excl-filter-btn"
            :class="{ active: excludedStatus === 'excluded' }"
            @click="excludedStatus = 'excluded'"
          >已勾選不計入</button>
          <button
            type="button"
            class="excl-filter-btn"
            :class="{ active: excludedStatus === 'included' }"
            @click="excludedStatus = 'included'"
          >未勾選不計入</button>
        </div>

        <div v-if="hasActiveFilter" class="filter-hint">
          <span>篩選中：</span>
          <span
            v-for="s in selectedAccountFilters"
            :key="s.account + '_' + s.currency"
            class="filter-chip"
          >
            {{ s.account }}／{{ s.currency }}
            <button type="button" class="filter-chip-x" @click="removeAccountFilter(s.account, s.currency)" aria-label="移除帳戶篩選">×</button>
          </span>
          <span v-if="excludedStatus !== 'all'" class="filter-chip">
            {{ excludedStatus === 'excluded' ? '已勾選不計入' : '未勾選不計入' }}
            <button type="button" class="filter-chip-x" @click="excludedStatus = 'all'" aria-label="移除不計入篩選">×</button>
          </span>
          <span v-if="dateFilterActive" class="filter-chip">
            {{ dateFilterValue }}
            <button type="button" class="filter-chip-x" @click="dateFilterActive = false" aria-label="移除日期篩選">×</button>
          </span>
          <button class="btn small" @click="clearFilters">清除全部</button>
        </div>

        <!-- 排序：帳戶／幣別／日期，最多三層優先順序（陣列索引＝優先順序）。
             僅改變顯示順序，不影響 store.records 原始順序，也不影響上方篩選結果。 -->
        <div class="sort-row" role="group" aria-label="排序設定">
          <span class="sort-label">排序：</span>
          <span
            v-for="(rule, idx) in sortRules"
            :key="rule.field"
            class="filter-chip sort-chip"
          >
            <button
              type="button"
              class="sort-chip-move"
              :disabled="idx === 0"
              @click="moveSortRule(idx, -1)"
              aria-label="提高優先順序"
            >↑</button>
            <button
              type="button"
              class="sort-chip-move"
              :disabled="idx === sortRules.length - 1"
              @click="moveSortRule(idx, 1)"
              aria-label="降低優先順序"
            >↓</button>
            <button
              type="button"
              class="sort-chip-order"
              @click="toggleSortOrder(idx)"
              :aria-label="'切換' + sortFieldLabel(rule.field) + '排序方向'"
            >{{ sortFieldLabel(rule.field) }} {{ sortOrderLabel(rule) }}</button>
            <button
              type="button"
              class="filter-chip-x"
              @click="removeSortRule(idx)"
              aria-label="移除此排序條件"
            >×</button>
          </span>
          <select
            v-if="availableSortFields.length"
            class="sort-add-select"
            @change="onAddSortField($event)"
            aria-label="新增排序條件"
          >
            <option value="">＋新增排序條件</option>
            <option v-for="f in availableSortFields" :key="f" :value="f">{{ sortFieldLabel(f) }}</option>
          </select>
          <button type="button" class="btn small" @click="resetSort">重設排序</button>
        </div>

        <div v-if="sortedRecords.length === 0" class="empty-hint">
          此類別尚無明細
          <template v-if="hasActiveFilter">（符合目前篩選條件）</template>
          <template v-else>，點「＋新增」開始</template>
          <button v-if="hasActiveFilter" class="btn small" @click="clearFilters">清除篩選</button>
        </div>

        <div v-for="rec in sortedRecords" :key="rec.id" class="rec-card" :class="{ 'rec-excluded': rec.excluded }">
          <!-- 收合摘要列：預設收合，點擊展開/收合；日期僅顯示 MM-DD，rec.date 本身仍為 YYYY-MM-DD -->
          <div class="rec-summary" @click="toggleExpand(rec.id)">
            <span class="rec-summary-date">{{ dateMD(rec.date) }}</span>
            <span class="rec-summary-account">{{ rec.account || '(未命名)' }}</span>
            <span class="rec-summary-amount">{{ num(money(rec)) }}</span>
            <span class="rec-toggle-arrow">{{ isExpanded(rec.id) ? '▽' : '▷' }}</span>
          </div>

          <template v-if="isExpanded(rec.id)">
          <div class="rec-grid">
            <div class="rec-row">
              <div class="rec-field">
                <label>日期</label>
                <!-- iOS Safari 會依系統語系將 date input 顯示為「YYYY年M月D日」，且無法透過
                     CSS 直接改變其原生文字格式。做法：原生 input[type="date"] 完全保留預設互動
                     行為（不移除 appearance、不使用 opacity/pointer-events 隱藏、不使用 showPicker()
                     或程式模擬 click()），僅將其原生文字設為透明（color:transparent 及對應
                     WebKit datetime 偽元素），再於下方以 pointer-events:none 的文字層顯示
                     固定 YYYY-MM-DD 格式，兩者透過 wrapper 疊合對齊。 -->
                <div class="date-field-wrap">
                  <input type="date" v-model="rec.date" class="date-native-input" />
                  <span class="date-display-text">{{ rec.date }}</span>
                </div>
              </div>
              <div class="rec-field">
                <label>帳戶/項目</label>
                <select v-model="rec.account" @change="onAccountChange(rec)">
                  <option value="">（請選擇）</option>
                  <option v-for="a in accountOptions(rec)" :key="a" :value="a">{{ a }}</option>
                </select>
              </div>
              <div class="rec-field">
                <label>金額</label>
                <input type="text" :value="num(money(rec))" readonly />
              </div>
            </div>

            <div class="rec-row">
              <div class="rec-field">
                <label>類別</label>
                <select v-model="rec.type" @change="onTypeChange(rec)">
                  <option v-for="t in types" :key="t" :value="t">{{ catName(t) }}</option>
                </select>
              </div>
              <div class="rec-field">
                <label>價格</label>
                <input type="number" :value="rec.unitPrice" readonly />
              </div>
            </div>

            <div class="rec-row" v-if="rec.type === '投資'">
              <div class="rec-field">
                <label>槓桿倍數</label>
                <input type="number" step="0.1" v-model.number="rec.leverage" />
              </div>
              <div class="rec-field">
                <label>曝險金額</label>
                <input type="text" :value="exposure(rec).toLocaleString()" readonly />
              </div>
            </div>

            <div class="rec-row">
              <div class="rec-field">
                <label>幣別</label>
                <select v-model="rec.currency" @change="onCurrencyChange(rec)">
                  <option v-for="c in currencyOptions" :key="c" :value="c">{{ c }}</option>
                </select>
              </div>
              <div class="rec-field">
                <label>匯率</label>
                <input type="number" :value="rec.fxRate" readonly />
              </div>
              <div class="rec-field">
                <label>單位</label>
                <input type="number" v-model.number="rec.units" @change="recalc(rec)" />
              </div>
            </div>

            <div class="rec-row rec-row-inline">
              <div class="rec-field rec-field-shrink">
                <label class="rec-exclude">
                  <input type="checkbox" v-model="rec.excluded" :true-value="1" :false-value="0" />
                  <span>不計入</span>
                </label>
              </div>
              <div class="rec-field rec-field-grow rec-field-note">
                <input type="text" v-model="rec.note" placeholder="備註" />
              </div>
            </div>
          </div>
          <div class="rec-actions">
            <button class="btn small danger" @click="removeRow(rec.id)">刪除</button>
          </div>
          </template>
        </div>
      </div>
    </div>
  </script>

  <script type="text/x-template" id="tpl-settings">
    <div class="page-content">
      <div class="subtab-bar">
        <button
          class="subtab-btn"
          :class="{ active: settingsTab === 'system' }"
          @click="settingsTab = 'system'"
        >系統</button>
        <button
          class="subtab-btn"
          :class="{ active: settingsTab === 'account' }"
          @click="settingsTab = 'account'"
        >帳戶</button>
      </div>

      <!-- ===== 系統子分頁 ===== -->
      <template v-if="settingsTab === 'system'">
      <div class="card">
        <div class="section-title">外觀設定</div>
        <div class="form-row">
          <label>深色/淺色模式</label>
          <select v-model="settings.themeMode">
            <option value="dark">深色</option>
            <option value="light">淺色</option>
          </select>
        </div>
        <div class="form-row">
          <label>配色</label>
          <div class="theme-swatch-row">
            <button
              v-for="(c, key) in themeColors"
              :key="key"
              type="button"
              class="theme-swatch"
              :class="{ active: settings.themeColor === key }"
              :style="{ background: c.accent }"
              :title="c.label"
              @click="settings.themeColor = key"
            ></button>
            <label
              class="theme-swatch theme-swatch-custom"
              :class="{ active: settings.themeColor === 'custom' }"
              :style="settings.themeColor === 'custom' ? { background: settings.customColor } : {}"
              title="自訂顏色"
            >
              <span v-if="settings.themeColor !== 'custom'" class="theme-swatch-custom-icon">＋</span>
              <input
                type="color"
                v-model="settings.customColor"
                @input="settings.themeColor = 'custom'"
              />
            </label>
          </div>
        </div>
        <div class="form-row">
          <label>字型</label>
          <select v-model="settings.fontFamily">
            <option v-for="(f, key) in fontFamilies" :key="key" :value="key">{{ f.label }}</option>
          </select>
        </div>
        <div class="form-row">
          <label>字型大小</label>
          <select v-model="settings.fontSize">
            <option v-for="(s, key) in fontSizes" :key="key" :value="key">{{ s.label }}</option>
          </select>
        </div>
      </div>

      <div class="card">
        <div class="section-title">顯示單位</div>
        <div class="form-row">
          <label>總覽金額單位</label>
          <select v-model="settings.unit">
            <option value="yuan">元</option>
            <option value="wan">萬元</option>
          </select>
        </div>
      </div>

      <div class="card">
        <div class="section-title">資料來源自動更新</div>
        <div class="form-row">
          <label>自動抓取即時匯率（Frankfurter）</label>
          <input type="checkbox" v-model="settings.autoFx" />
        </div>
        <div class="form-row">
          <label>自動抓取股票市值（best-effort，可能失敗）</label>
          <input type="checkbox" v-model="settings.autoStock" />
        </div>
        <div class="empty-hint" style="text-align:left">
          預設為手動輸入。於「設定 &gt; 帳戶」的「同步價格」按鈕可一次更新所有帳戶/項目的價格（投資取即時市價）；
          股價來源非官方 API，若查詢失敗請改回手動輸入。內部網路無法連外時更新會失敗，屬正常現象。
        </div>
      </div>

      <div class="card">
        <div class="section-title">資料管理</div>
        <div class="toolbar">
          <button class="btn secondary" @click="exportCsv">匯出 CSV</button>
          <button class="btn secondary" @click="$refs.fileInput.click()">匯入 CSV</button>
          <input type="file" ref="fileInput" accept=".csv" style="display:none" @change="importCsv" />
          <button class="btn secondary" @click="loadSample">載入模擬資料</button>
          <button class="btn danger" @click="resetData">清除所有本地資料</button>
          <button class="btn danger" @click="forceReset">強制清除並重新載入</button>
        </div>
        <hr class="data-divider" />
        <div class="empty-hint" style="text-align:left">帳戶/項目設定（類別、帳戶/項目、價格、槓桿倍數）的匯出入：</div>
        <div class="toolbar">
          <button class="btn secondary" @click="exportAccountsCsv">匯出帳戶設定</button>
          <button class="btn secondary" @click="$refs.accFileInput.click()">匯入帳戶設定</button>
          <input type="file" ref="accFileInput" accept=".csv" style="display:none" @change="importAccountsCsv" />
        </div>
        <div class="empty-hint" style="text-align:left">所有資料僅儲存在目前瀏覽器的 IndexedDB，清除瀏覽器資料或更換裝置/瀏覽器將會遺失，請定期使用「匯出 CSV」備份。明細「匯入 CSV」與「載入模擬資料」皆為「附加」至現有資料，重複匯入會產生重複資料；若要用備份 CSV 還原改版前資料，建議先按「清除所有本地資料」清空後再匯入。帳戶/項目設定的「匯入帳戶設定」則是「取代」現有設定（匯入前會另外跳出確認）。若一般清除無效或資料異常，可用「強制清除並重新載入」。iOS Safari 中「設定 > Safari > 清除瀏覽記錄與網站資料」或「清除 Cookie」也會一併清除本 App 的資料，請務必先備份再操作。</div>
        <div class="empty-hint" style="text-align:left">Web Inspector 疑難排解：若畫面出現「Script error.」等看不到細節的錯誤，可用 Mac 連接 iPhone，於 iPhone「設定 > Safari > 進階」開啟「網頁檢閱器」，再於 Mac Safari「開發」選單中開啟本頁面即可看到完整錯誤堆疊。</div>
      </div>
      </template>

      <!-- ===== 帳戶子分頁 ===== -->
      <template v-else>
      <div class="card">
        <div class="section-title">幣別</div>
        <div class="toolbar">
          <button class="btn" @click="addCurrency">＋新增幣別</button>
          <button class="btn warn" @click="syncFxRates" :disabled="syncingFx">
            {{ syncingFx ? '同步中…' : '同步匯率' }}
          </button>
        </div>
        <div class="cfg-table">
          <div class="cfg-row cfg-row-cur cfg-head">
            <span>幣別代碼</span>
            <span>匯率</span>
            <span></span>
          </div>
          <div class="cfg-row cfg-row-cur" v-for="cur in settings.currencies" :key="cur.code + '_' + settings.currencies.indexOf(cur)">
            <input
              type="text"
              class="cfg-cur-code"
              v-model="cur.code"
              :placeholder="'幣別'"
              :disabled="cur.code === settings.baseCurrency"
              @blur="onCurrencyCodeBlur"
            />
            <input
              type="number"
              v-model.number="cur.rate"
              :disabled="cur.code === settings.baseCurrency"
              @change="applyFxToRecords"
            />
            <button
              class="btn small danger"
              :disabled="cur.code === settings.baseCurrency"
              @click="removeCurrency(cur.code)"
            >刪除</button>
          </div>
        </div>
        <div class="empty-hint" style="text-align:left">基準幣別 {{ settings.baseCurrency }} 匯率固定為 1，不可刪除或修改。「同步匯率」會抓取各幣別對 {{ settings.baseCurrency }} 的即時匯率。明細輸入與 CSV 匯出入的幣別/匯率皆與此連動。</div>
      </div>

      <div class="card">
        <div class="section-title">資產類別</div>
        <div class="cfg-table">
          <div class="cfg-row cfg-head">
            <span>類別</span>
            <span>名稱</span>
          </div>
          <div class="cfg-row" v-for="key in assetCategoryKeys" :key="key">
            <span class="cfg-cat">{{ key }}</span>
            <input
              type="text"
              v-model="settings.categoryNames[key]"
              :placeholder="key"
              @blur="onCategoryNameBlur(key)"
            />
          </div>
        </div>
        <div class="empty-hint" style="text-align:left">名稱可修改（空白會自動帶回預設），行數固定 4 個。此名稱會套用於畫面呈現與 CSV 匯出入的「類型」欄位值。</div>
      </div>

      <div class="card">
        <div class="section-title">帳戶/項目</div>
        <div class="toolbar">
          <button class="btn" @click="addAccount">＋新增帳戶/項目</button>
          <button class="btn warn" @click="syncPrices" :disabled="syncing">
            {{ syncing ? '同步中…' : '同步價格' }}
          </button>
        </div>
        <div v-if="accounts.length === 0" class="empty-hint">尚無帳戶/項目，點「＋新增帳戶/項目」開始</div>
        <div class="acc-cfg-card" v-for="(acc, idx) in accounts" :key="acc.id">
          <div class="acc-cfg-grid">
            <div class="rec-field">
              <label>類別</label>
              <select v-model="acc.category" @change="onAccountCategoryChange(acc)">
                <option v-for="t in types" :key="t" :value="t">{{ catName(t) }}</option>
              </select>
            </div>
            <div class="rec-field">
              <label>帳戶/項目</label>
              <input type="text" v-model="acc.account" placeholder="帳戶/項目" />
            </div>
            <div class="rec-field">
              <label>價格</label>
              <input type="number" v-model.number="acc.price" />
            </div>
            <div class="rec-field">
              <label>槓桿倍數</label>
              <input type="number" v-model.number="acc.leverage" />
            </div>
          </div>
          <div class="acc-cfg-actions">
            <button class="btn small" @click="moveAccountUp(acc.id)" :disabled="idx === 0" aria-label="上移">↑</button>
            <button class="btn small" @click="moveAccountDown(acc.id)" :disabled="idx === accounts.length - 1" aria-label="下移">↓</button>
            <button class="btn small danger" @click="removeAccount(acc.id)">刪除</button>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="section-title">同步記錄</div>
        <div class="form-row">
          <label>記錄同步價格/匯率的詳細執行資訊（含 API 請求與回應內容）</label>
          <input type="checkbox" v-model="settings.syncLogEnabled" />
        </div>
        <div class="toolbar">
          <button class="btn secondary" @click="exportSyncLogs" :disabled="syncLogs.length === 0">匯出記錄（JSON）</button>
          <button class="btn danger" @click="clearSyncLogs" :disabled="syncLogs.length === 0">清除記錄</button>
        </div>
        <div class="empty-hint" style="text-align:left">
          目前筆數：{{ syncLogs.length }} / {{ syncLogMax }}（超過上限會自動捨棄最舊的記錄）。
          開關預設關閉，僅在需要排查「同步價格」「同步匯率」失敗原因時再手動開啟；
          記錄內容含完整 API 請求網址與回應內容，開啟後才會於每次同步時寫入。
        </div>
      </div>

      <div class="card">
        <div class="section-title">套用至明細</div>
        <div class="empty-hint" style="text-align:left">依「類別 + 帳戶/項目」把設定值更新到現有明細資料並重算金額/曝險。</div>
        <div class="toolbar">
          <button class="btn secondary" @click="applyFxToRecords">套用匯率</button>
          <button class="btn secondary" @click="applyPricesToRecords">套用價格</button>
          <button class="btn secondary" @click="applyLeverageToRecords">套用倍數</button>
          <button class="btn" @click="applyAllToRecords">全部套用</button>
        </div>
      </div>
      </template>
    </div>
  </script>

       ?cb= 為快取破壞參數：避免瀏覽器沿用「加上 crossorigin 之前」快取的舊版回應（會導致錯誤細節持續被隱藏）。 -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js?cb=20260818" crossorigin="anonymous" onerror="window.__cdnLoadError && window.__cdnLoadError('Vue')"></script>
