<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>資產負債看板 App</title>
    <!-- 引入 Tailwind CSS 用於美化介面 -->
    <script src="https://tailwindcss.com"></script>
    <style>
        /* 隱藏未活化的頁面 */
        .page-content { display: none; }
        .page-content.active { display: block; }
        body { padding-bottom: 90px; } /* 為下方導覽列留空間 */
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen">

    <!-- 主內容容器 -->
    <main class="container mx-auto px-4 py-6 max-w-4xl">
        
        <!-- ==================== 1. 總覽分頁 ==================== -->
        <section id="page-overview" class="page-content active space-y-6">
            <h1 class="text-2xl font-bold text-gray-900">📊 資產負債總覽</h1>
            
            <!-- 上半部: KPI 區塊 -->
            <div class="grid grid-cols-3 gap-4">
                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                    <p class="text-sm text-gray-500 font-medium">總資產</p>
                    <p id="kpi-assets" class="text-xl font-bold text-emerald-600 mt-1">$0</p>
                </div>
                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                    <p class="text-sm text-gray-500 font-medium">總負債 (負債比)</p>
                    <p id="kpi-liabilities" class="text-xl font-bold text-rose-600 mt-1">$0 <span id="kpi-debt-ratio" class="text-xs font-normal text-gray-500">(0%)</span></p>
                </div>
                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                    <p class="text-sm text-gray-500 font-medium">淨資產</p>
                    <p id="kpi-net-worth" class="text-xl font-bold text-blue-600 mt-1">$0</p>
                </div>
            </div>

            <!-- 中間與下半部: 資產子項目區塊 -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 space-y-4">
                <h2 class="text-lg font-semibold text-gray-700">資產配置比例</h2>
                <div id="overview-items-container" class="space-y-4">
                    <!-- 動態渲染流動資產、投資、固定資產、應收款 -->
                </div>
            </div>
        </section>

        <!-- ==================== 2. 再平衡分頁 ==================== -->
        <section id="page-rebalance" class="page-content space-y-6">
            <h1 class="text-2xl font-bold text-gray-900">⚖️ 資金再平衡</h1>
            
            <!-- 第1區: 曝險與總額資訊 -->
            <div class="grid grid-cols-3 gap-4 bg-white p-5 rounded-xl shadow-sm border border-gray-100">
                <div>
                    <p class="text-sm text-gray-500">曝險金額 (TWD)</p>
                    <p id="reb-exposure" class="text-lg font-bold text-orange-600 mt-1">$0</p>
                </div>
                <div>
                    <p class="text-sm text-gray-500">可動用總額 (流動+投資)</p>
                    <p id="reb-liquid-total" class="text-lg font-bold text-gray-800 mt-1">$0</p>
                </div>
                <div>
                    <p class="text-sm text-gray-500">曝險比</p>
                    <p id="reb-exposure-ratio" class="text-lg font-bold text-gray-800 mt-1">0%</p>
                </div>
            </div>

            <!-- 第2區: 再平衡計算機制 -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 space-y-4">
                <div class="flex items-center justify-between">
                    <label class="font-medium text-gray-700">設定投資再平衡率 (投資佔比)：</label>
                    <select id="reb-select-ratio" class="border rounded-lg p-2 bg-gray-50 font-medium" onchange="calculateRebalance()">
                        <option value="0.5">50% (流動 50% : 投資 50%)</option>
                        <option value="0.6">60% (流動 40% : 投資 60%)</option>
                        <option value="0.7" selected>70% (流動 30% : 投資 70%)</option>
                        <option value="0.8">80% (流動 20% : 投資 80%)</option>
                        <option value="0.9">90% (流動 10% : 投資 90%)</option>
                        <option value="1.0">100% (流動 0% : 投資 100%)</option>
                    </select>
                </div>

                <div class="border-t pt-4">
                    <p class="text-sm text-gray-500">目前實際比例 (流動 : 投資)</p>
                    <div class="flex items-center space-x-2 mt-1">
                        <span id="reb-current-ratio-text" class="font-semibold text-gray-700">0% : 0%</span>
                    </div>
                </div>

                <div class="bg-blue-50 p-4 rounded-xl border border-blue-100 flex items-center justify-between">
                    <div>
                        <p class="text-sm text-blue-700 font-medium">再平衡執行建議</p>
                        <p id="reb-action-msg" class="text-lg font-bold text-blue-900 mt-1">無需變動</p>
                    </div>
                    <div id="reb-action-badge" class="px-4 py-2 rounded-lg font-bold text-sm bg-gray-200 text-gray-700">💡 檢視中</div>
                </div>
            </div>
        </section>

        <!-- ==================== 3. 明細分頁 ==================== -->
        <section id="page-details" class="page-content space-y-6">
            <h1 class="text-2xl font-bold text-gray-900">🗒️ 帳目明細管理</h1>

            <!-- 上半區：匯總資訊 -->
            <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100 space-y-3">
                <h3 class="font-semibold text-gray-700">分區幣別匯總</h3>
                <div id="details-summary-container" class="grid grid-cols-2 gap-3 text-xs">
                    <!-- 動態渲染匯總資訊 -->
                </div>
            </div>

            <!-- 中間區：表單新增與明細列表 -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                <div class="p-4 bg-gray-50 border-b flex justify-between items-center">
                    <span class="font-semibold text-gray-700">明細資料清單</span>
                    <button onclick="openModal()" class="bg-blue-600 text-white px-3 py-1.5 rounded-lg text-sm font-medium hover:bg-blue-700 transition">＋ 新增項目</button>
                </div>
                
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse text-sm">
                        <thead>
                            <tr class="bg-gray-100 text-gray-600 uppercase text-xs">
                                <th class="p-3">類型</th>
                                <th class="p-3">帳戶/項目</th>
                                <th class="p-3">單價/單位</th>
                                <th class="p-3">幣別/匯率</th>
                                <th class="p-3">金額 (TWD)</th>
                                <th class="p-3">曝險 (槓桿)</th>
                                <th class="p-3 text-center">操作</th>
                            </tr>
                        </thead>
                        <tbody id="details-tbody" class="divide-y divide-gray-100">
                            <!-- 動態插入資料列 -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- 下半區：資料匯入及匯出 -->
            <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100 flex items-center justify-between">
                <div>
                    <h3 class="font-semibold text-gray-700">資料備份與傳輸</h3>
                    <p class="text-xs text-gray-400 mt-0.5">支援標準 CSV 格式檔案</p>
                </div>
                <div class="flex items-center space-x-3">
                    <label class="cursor-pointer bg-gray-100 text-gray-700 px-4 py-2 rounded-lg text-sm font-medium hover:bg-gray-200 transition">
                        📥 匯入 CSV
                        <input type="file" id="csv-file-input" accept=".csv" class="hidden" onchange="importCSV(event)">
                    </label>
                    <button onclick="exportCSV()" class="bg-gray-800 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-gray-900 transition">📤 匯出 CSV</button>
                </div>
            </div>
        </section>

        <!-- ==================== 4. 設定分頁 ==================== -->
        <section id="page-settings" class="page-content space-y-6">
            <h1 class="text-2xl font-bold text-gray-900">📌 系統設定</h1>
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 space-y-4">
                <div>
                    <label class="block font-medium text-gray-700 mb-2">總覽數值呈現單位</label>
                    <div class="flex space-x-4">
                        <label class="flex items-center space-x-2 cursor-pointer">
                            <input type="radio" name="unit-setting" value="1" checked onchange="saveSettings()" class="text-blue-600 focus:ring-blue-500">
                            <span class="text-sm font-medium text-gray-700">元 (原始金額)</span>
                        </label>
                        <label class="flex items-center space-x-2 cursor-pointer">
                            <input type="radio" name="unit-setting" value="10000" onchange="saveSettings()" class="text-blue-600 focus:ring-blue-500">
                            <span class="text-sm font-medium text-gray-700">萬元 (金額 / 10,000)</span>
                        </label>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <!-- ==================== 新增/編輯 彈出視窗 (Modal) ==================== -->
    <div id="data-modal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl max-w-md w-full p-6 space-y-4 max-h-[90vh] overflow-y-auto">
            <h2 id="modal-title" class="text-lg font-bold text-gray-900">新增明細項目</h2>
            <form id="modal-form" onsubmit="handleFormSubmit(event)" class="space-y-3 text-sm">
                <input type="hidden" id="form-id">
                
                <div>
