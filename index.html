<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover 讓內容延伸至瀏海/圓角區域，搭配 safe-area-inset 使用 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#1c1c2e" />
  <title>資產負債看板</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app"></div>

  <!-- ============ 分頁模板（text/x-template，不需 build step） ============ -->

  <script type="text/x-template" id="tpl-overview">
    <div class="page-content">
      <div class="kpi-row">
        <div class="kpi-card">
          <div class="kpi-label">資產</div>
          <div class="kpi-value">{{ fmt(totalAssets) }}</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">負債</div>
          <div class="kpi-value">{{ fmt(totalLiabilities) }}</div>
          <div class="kpi-sub">負債比 {{ pct(liabilityRatio) }}</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">淨資產</div>
          <div class="kpi-value" :class="netAssets >= 0 ? 'positive' : 'negative'">{{ fmt(netAssets) }}</div>
        </div>
      </div>

      <div class="card">
        <div class="section-title">資產組成</div>
        <div v-if="totalAssets <= 0" class="empty-hint">尚無資產資料，請至「明細」新增</div>
        <div v-for="item in breakdown" :key="item.type" class="asset-item">
          <div class="asset-item-row">
            <span class="asset-item-name">{{ item.type }}</span>
            <span class="asset-item-amt">{{ fmt(item.amount) }}（{{ pct(item.ratio) }}）</span>
          </div>
          <div class="progress-bar">
            <div class="progress-bar-fill" :style="{ width: (item.ratio * 100) + '%' }"></div>
          </div>
        </div>
      </div>
    </div>
  </script>

  <script type="text/x-template" id="tpl-rebalance">
    <div class="page-content">
      <div class="card">
        <div class="section-title">曝險概況</div>
        <div class="summary-group"><span>曝險金額</span><span>{{ fmt(exposureTotal) }}</span></div>
        <div class="summary-group"><span>可動用總金額（流動資產+投資）</span><span>{{ fmt(pool) }}</span></div>
        <div class="summary-group"><span>曝險比</span><span>{{ pct(exposureRatio) }}</span></div>
      </div>

      <div class="card">
        <div class="section-title">資金再平衡率</div>
        <div class="form-row">
          <label>投資目標佔比（流動:投資）</label>
          <select v-model.number="settings.rebalanceRatio" @change="onRatioChange">
            <option v-for="r in ratioOptions" :key="r" :value="r">
              {{ 100 - r }}% : {{ r }}%
            </option>
          </select>
        </div>
        <div class="summary-group"><span>目前流動資產</span><span>{{ fmt(liquidTWD) }}（{{ pct(liquidRatio) }}）</span></div>
        <div class="summary-group"><span>目前投資</span><span>{{ fmt(investTWD) }}（{{ pct(investRatio) }}）</span></div>
      </div>

      <div class="card rebalance-result">
        <div v-if="pool <= 0" class="empty-hint">尚無流動資產或投資資料</div>
        <template v-else>
          <div class="rebalance-action" :class="action.type">{{ action.label }}</div>
          <div class="rebalance-amount" v-if="action.amount > 0">{{ fmt(action.amount) }}</div>
        </template>
      </div>
    </div>
  </script>

  <script type="text/x-template" id="tpl-detail">
    <div class="page-content">
      <div class="card">
        <div class="section-title">分類彙總</div>
        <div v-if="groupedSummary.length === 0" class="empty-hint">尚無資料</div>
        <div v-for="g in groupedSummary" :key="g.type + g.account + g.currency" class="summary-group">
          <span>{{ g.type }} / {{ g.account }} / {{ g.currency }}</span>
          <span v-if="g.type === '投資'">單位數 {{ g.unitsSum.toLocaleString() }}，金額 {{ g.amountSum.toLocaleString() }} {{ g.currency }}</span>
          <span v-else>{{ g.amountSum.toLocaleString() }} {{ g.currency }}（約 {{ fmt(g.amountTWDSum) }}）</span>
        </div>
      </div>

      <div class="card">
        <div class="toolbar">
          <button class="btn" @click="addRow">＋ 新增一筆</button>
        </div>
        <div class="table-scroll">
          <table class="detail-table">
            <thead>
              <tr>
                <th>類型</th><th>帳戶/項目</th><th>日期</th><th>備註</th>
                <th>單價</th><th>幣別</th><th>匯率</th><th>單位數</th>
                <th>金額</th><th>槓桿率</th><th>曝險金額(TWD)</th><th>操作</th>
              </tr>
            </thead>
            <tbody>
              <tr v-for="rec in records" :key="rec.id">
                <td>
                  <select v-model="rec.type">
                    <option v-for="t in types" :key="t" :value="t">{{ t }}</option>
                  </select>
                </td>
                <td><input type="text" v-model="rec.account" placeholder="帳戶/項目" /></td>
                <td><input type="date" v-model="rec.date" /></td>
                <td><input type="text" v-model="rec.note" placeholder="備註" /></td>
                <td><input type="number" v-model.number="rec.unitPrice" @change="recalc(rec)" /></td>
                <td><input type="text" v-model="rec.currency" style="width:60px" /></td>
                <td>
                  <div style="display:flex; gap:4px; align-items:center;">
                    <input type="number" v-model.number="rec.fxRate" style="width:70px" />
                    <button v-if="settings.autoFx && rec.currency !== settings.baseCurrency" class="btn small secondary" @click="updateFx(rec)">抓</button>
                  </div>
                </td>
                <td><input type="number" v-model.number="rec.units" @change="recalc(rec)" /></td>
                <td><input type="number" v-model.number="rec.amount" /></td>
                <td><input type="number" v-model.number="rec.leverage" step="0.1" /></td>
                <td>{{ exposure(rec).toLocaleString() }}</td>
                <td class="row-actions">
                  <button v-if="settings.autoStock && rec.type === '投資'" class="btn small secondary" @click="updateStock(rec)">股價</button>
                  <button class="btn small danger" @click="removeRow(rec.id)">刪</button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="card">
        <div class="section-title">資料匯入 / 匯出</div>
        <div class="toolbar">
          <button class="btn secondary" @click="exportCsv">匯出 CSV</button>
          <button class="btn secondary" @click="$refs.fileInput.click()">匯入 CSV</button>
          <input type="file" ref="fileInput" accept=".csv" style="display:none" @change="importCsv" />
        </div>
      </div>
    </div>
  </script>

  <script type="text/x-template" id="tpl-settings">
    <div class="page-content">
      <div class="card">
        <div class="section-title">顯示單位</div>
        <div class="form-row">
          <label>總覽金額單位</label>
          <select v-model="settings.unit">
            <option value="yuan">元</option>
            <option value="wan">萬元</option>
          </select>
        </div>
      </div>

      <div class="card">
        <div class="section-title">資料來源自動更新</div>
        <div class="form-row">
          <label>自動抓取即時匯率（Frankfurter）</label>
          <input type="checkbox" v-model="settings.autoFx" />
        </div>
        <div class="form-row">
          <label>自動抓取股票市值（best-effort，可能失敗）</label>
          <input type="checkbox" v-model="settings.autoStock" />
        </div>
        <div class="empty-hint" style="text-align:left">
          預設為手動輸入。開啟後於「明細」頁每列可個別按「抓」更新匯率或股價；
          股價來源非官方 API，若查詢失敗請改回手動輸入單價。
        </div>
      </div>

      <div class="card">
        <div class="section-title">資料管理</div>
        <div class="toolbar">
          <button class="btn danger" @click="resetData">清除所有本地資料</button>
        </div>
        <div class="empty-hint" style="text-align:left">所有資料僅儲存在本機瀏覽器 localStorage，清除瀏覽器資料或更換裝置/瀏覽器將會遺失，請定期使用「明細」頁的匯出 CSV 備份。</div>
      </div>
    </div>
  </script>

  <!-- Vue 3 全域版本（CDN，不需 npm/build） -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <!-- PapaParse：處理 CSV 匯入/匯出 -->
  <script src="https://unpkg.com/papaparse@5/papaparse.min.js"></script>

  <script src="js/store.js"></script>
  <script src="js/services.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
